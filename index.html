<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10233f" />
    <script>
      // Apply the validated preference before first paint; blocked storage stays light.
      try {
        const theme = JSON.parse(localStorage.getItem('genset-demo:v1:theme') || '"light"');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch { /* Default light theme. */ }
    </script>
    <meta name="description" content="Monitoring genset dan ringkasan parameter." />
    <title>Genset Monitor</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
