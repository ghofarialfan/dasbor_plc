<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111c2e" />
    <script>
      // Dark is the default; only a valid stored "light" preference opts out before first paint.
      let theme = 'dark';
      try {
        if (JSON.parse(localStorage.getItem('genset-demo:v1:theme')) === 'light') theme = 'light';
      } catch { /* Missing, malformed or blocked storage keeps the dark default. */ }
      if (theme === 'dark') document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = theme;
    </script>
    <meta name="description" content="Monitoring genset dan ringkasan parameter." />
    <title>Genset Monitor</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
